name: MindfulScreenTime
options:
  bundleIdPrefix: com.mindful
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

targets:
  MindfulScreenTime:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: MindfulScreenTime
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mindful.screentime
        INFOPLIST_FILE: MindfulScreenTime/Info.plist
        GENERATE_INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_VERSION: "5.9"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0.0"
        CODE_SIGN_STYLE: Automatic

  MindfulScreenTimeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MindfulScreenTimeTests
    dependencies:
      - target: MindfulScreenTime
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mindful.screentime.tests
        SWIFT_VERSION: "5.9"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MindfulScreenTime.app/MindfulScreenTime"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  MindfulScreenTime:
    build:
      targets:
        MindfulScreenTime: all
        MindfulScreenTimeTests: [test]
    test:
      targets:
        - MindfulScreenTimeTests
