name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package IPA
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Run Unit Tests
        run: |
          xcodebuild test \
            -project MindfulScreenTime.xcodeproj \
            -scheme MindfulScreenTime \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty || true

      - name: Build App (Archive)
        run: |
          xcodebuild archive \
            -project MindfulScreenTime.xcodeproj \
            -scheme MindfulScreenTime \
            -archivePath build/MindfulScreenTime.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Payload to IPA
        run: |
          mkdir -p build/Payload
          cp -r build/MindfulScreenTime.xcarchive/Products/Applications/MindfulScreenTime.app build/Payload/
          cd build
          zip -r MindfulScreenTime.ipa Payload
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MindfulScreenTime-Unsigned-IPA
          path: build/MindfulScreenTime.ipa
          retention-days: 14
