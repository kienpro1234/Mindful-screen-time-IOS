name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package IPA
    runs-on: macos-15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Run Unit Tests
        run: |
          SIM_ID=$(xcrun simctl list devices available iPhone | grep -E -o "[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}" | head -n 1)
          echo "Using Simulator ID: $SIM_ID"
          xcodebuild test \
            -project MindfulScreenTime.xcodeproj \
            -scheme MindfulScreenTime \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Build App (Archive)
        run: |
          xcodebuild archive \
            -project MindfulScreenTime.xcodeproj \
            -scheme MindfulScreenTime \
            -archivePath build/MindfulScreenTime.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Payload to IPA
        run: |
          mkdir -p build/Payload
          cp -r build/MindfulScreenTime.xcarchive/Products/Applications/MindfulScreenTime.app build/Payload/
          cd build
          zip -r MindfulScreenTime.ipa Payload
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MindfulScreenTime-Unsigned-IPA
          path: build/MindfulScreenTime.ipa
          retention-days: 14
